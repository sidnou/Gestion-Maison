[project]
name = "gestion-maison"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sidnou", email = "sidjack972@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "django==6.1.3",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-tailwind[cookiecutter,honcho,reload]>=4.6.0",
]

[project.scripts]
gestion-maison = "gestion_maison:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest==9.2.0",
    "ruff==0.17.4",
    "semgrep==1.184.0",
]

[tool.ruff]
exclude = ["**/migrations/**"]
